# Render Blueprint — CLNS
# PRODUCT COMPLIANCE INTELLIGENCE · KOREA
# Clearance, simplified.
# Korea Import Compliance MCP & API · 무료 Web Service (Docker)
#
# 사용법
#   1) 이 저장소를 Render에 연결하고 Blueprint(render.yaml)를 선택
#   2) 대시보드에서 DATA_GO_KR_SERVICE_KEY / LAW_GO_KR_OC 를 입력(sync:false = 저장소에 값이 없음)
#   3) 배포 후 https://<서비스>.onrender.com/ 에서 웹 UI 확인
#
# 주의
#   - free 플랜은 영구 디스크가 없다. 작업 DB(IMPORT_COMPLIANCE_DB, 기본 /app/data/app.sqlite)는
#     재배포·재시작 시 사라진다(판정 이력·쿼터 카운터 초기화). 리콜 인덱스(/app/data/recalls.sqlite)는
#     이미지에 포함되어 있어 재기동 때마다 자동으로 작업 DB에 다시 적재된다.
#   - free 플랜은 미접속 시 슬립되므로 첫 요청이 30~60초 걸릴 수 있다.
services:
  - type: web
    name: clns-kr
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: IMPORT_COMPLIANCE_LIVE
        value: "1"
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
      - key: LAW_GO_KR_OC
        sync: false
